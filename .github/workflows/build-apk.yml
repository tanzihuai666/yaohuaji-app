name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk ./妖画集.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk ./Yaohuaji.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 妖画集-Android安装包
          path: |
            妖画集.apk
            Yaohuaji.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.3
          name: 妖画集 · 设子系统重构与全套UI精修版 (v1.0.3)
          body: |
            ### 🌸 《妖画集》离线手账画库 Android 安装包 (v1.0.3)
            - **版本**：v1.0.3
            - **本次重点修复与优化**：
              - 🔑 **永久构建签名证书**：内置固定 keystore 签名，彻底告别签名不一致无法覆盖安装的问题；
              - 📦 **中文包名定制**：安装包正式命名为 `妖画集.apk`；
              - 🎀 **设子（OC）头像自由修改**：修复设子头像无法更换的严重逻辑 Bug，支持相册自定义图片，自适应高保真裁切展示；
              - 📝 **设子全属性独立编辑卡片**：彻底重构原有顺序 prompt 弹窗，推出高颜值手账模态框，姓名/性别/身高/年龄/生日/标签/外貌锚点/背景故事想改哪项就改哪项；
              - 🗑️ **设子直接删除功能**：在设子详情页及编辑卡片内均可直接删除设子档案，带贴心防误触二次确认；
              - 🎨 **告别原生安卓弹窗**：全局替换 `prompt` / `confirm` / `alert` 为马卡龙手账风格模态框，包含新建文件夹、新建分类、添加约稿等；
              - 🚀 **通知平移流体动效**：重构 Toast 通知，从屏幕左侧平滑平移滑入居中并带有弹性阻尼（Spring 动效），视觉体验丝滑。
          files: |
            妖画集.apk
            Yaohuaji.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
