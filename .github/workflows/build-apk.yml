name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk ./妖画集.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk ./Yaohuaji.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 妖画集-Android安装包
          path: |
            妖画集.apk
            Yaohuaji.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.4
          name: 妖画集 · 设子约稿系统全能版 (v1.0.4)
          body: |
            ### 🌸 《妖画集》离线手账画库 Android 安装包 (v1.0.4)
            - **版本**：v1.0.4
            - **本次重点修复与优化**：
              - 🚀 **全新独立应用标识 (com.yaohuaji.studio)**：彻底解决与旧版本或历史调试包签名/包名冲突的问题，无需担心冲突，直接顺利安装；
              - 🖼️ **批量相册导入真实画作**：批量导入约稿直接调起手机系统相册多选图片，自动智能压缩并生成真实画作约稿记录，彻底摒弃默认卡通小人头像；
              - 🎨 **单笔约稿画作选传与展示**：添加约稿支持即时选择画作封面，画库约稿卡片无图时贴心提供“点击传画作”入口；
              - ✏️ **约稿记录全能编辑与详情**：点击任意约稿卡片即可打开手账风专属模态框，支持全屏预览、重新换图/清除图片、自由修改稿件名称/应约画师/金额/截稿日/备注；
              - 🗑️ **约稿记录安全删除**：模态框内提供显眼删除按钮，附带手账风格二次确认并自动更新设子总花费与数据统计；
              - 🎀 **设子（OC）头像自由修改与删除**：支持相册自定义图片自适应高保真裁切，独立编辑全属性卡片，直接删除设子档案；
              - 🎨 **告别原生安卓风格弹窗**：全局替换所有 prompt 为手账风格模态框，通知流体弹性平移动效。
          files: |
            妖画集.apk
            Yaohuaji.apk
            android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
