name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yaohuaji-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.1
          name: 妖画集 · 体验修复优化版 (v1.0.1)
          body: |
            ### 🌸 《妖画集》离线手账画库 Android 安装包 (v1.0.1)
            - **版本**：v1.0.1
            - **本次修复与优化**：
              - 🎬 **开屏极速自播**：解除 Android WebView 手势限制，隐藏原生黑圆播放键，无缝自动播放 1.1s 开屏画卷；
              - 📅 **日历排版修复**：解决手机端周六列越界溢出，采用自适应布局与圆环胶囊，适配全机型；
              - 🎨 **画手头像自定义**：支持点击头像直接更换图片，相册选图自动智能高保真压缩保存；
              - 🖼️ **自定义背景激活**：背景图层深度重构，完美支持个人壁纸上传与透明度微调；
              - 🧹 **我的页面精简**：按需移除开屏重播卡与纯净承诺卡，界面清爽聚焦。
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
